version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    allow:
    - dependency-name: "*"
      dependency-type: "direct"
    groups:
      all-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    allow:
    - dependency-name: "*"
      dependency-type: "direct"
    groups:
      all-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    allow:
    - dependency-name: "*"
      dependency-type: "direct"
    groups:
      all-dependencies:
        patterns:
          - "*"
